<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Language Training Platform</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <!-- アプリ共通ヘッダー -->
    <header class="app-header">
        <h1 id="page_title">Language Training</h1>
        <div class="subtitle">Syntax & Structure</div>
    </header>

    <!-- ==========================================
         1. スタート画面 (Start Screen)
         ========================================== -->
    <div id="start-screen">
        <!-- 言語・カテゴリ選択 -->
        <div class="select-group">
            <label for="language-select">LANGUAGE</label>
            <select id="language-select" onchange="changeLanguage()"></select>
        </div>

        <div class="select-group">
            <label for="category-select">CATEGORY</label>
            <select id="category-select" onchange="changeCategory()"></select>
        </div>

        <!-- 問題数選択（アコーディオン） -->
        <div class="select-group">
            <label>NUMBER OF QUESTIONS</label>
            <div class="custom-accordion" id="count-accordion">
                <button type="button" class="accordion-trigger" onclick="toggleCountAccordion(event)">
                    <span id="selected-count-label">10 Questions</span>
                    <span class="arrow">▼</span>
                </button>
                <div class="accordion-content" id="count-options">
                    <div class="count-option active" data-value="10" onclick="selectQuestionCount('10', '10 Questions')">10 Questions</div>
                    <div class="count-option" data-value="5" onclick="selectQuestionCount('5', '5 Questions')">5 Questions</div>
                    <div class="count-option" data-value="3" onclick="selectQuestionCount('3', '3 Questions')">3 Questions</div>
                    <div class="count-option" data-value="all" onclick="selectQuestionCount('all', 'All Questions')">All Questions</div>
                </div>
            </div>
        </div>

        <button class="btn-primary" onclick="startTraining()">START TRAINING</button>
    </div>

    <!-- ==========================================
         2. トレーニング画面 (Quiz Screen)
         ========================================== -->
    <div id="quiz-screen" style="display: none;">
        <!-- 進捗カウンター (例: 3 / 10) -->
        <div class="quiz-header">
            <button id="btn-quit" onclick="confirmQuit()">✕ QUIT</button>
            <div class="progress-counter" id="progress-counter">0 / 10</div>
        </div>

        <div class="question-box" id="q-text">Instruction will appear here.</div>
        <div class="hint-box" id="h-text">Hint will appear here.</div>

        <div class="area-title">【Your Answer】(Tap to remove)</div>
        <div class="chip-area" id="answer-area"></div>

        <div class="area-title">【Options】(Tap to select)</div>
        <div class="chip-area" id="word-area"></div>

        <div id="feedback-msg" class="feedback"></div>

        <div class="actions">
            <button class="reset" onclick="resetAnswer()">Clear</button>
            <button class="check" id="btn-check" onclick="checkAnswer()">Check</button>
            <button id="btn-audio" class="audio" onclick="playCurrentAudio(event)" style="display: none;">🔊 LISTEN</button>
            <button class="next" id="btn-next" onclick="nextQuestion()">Next</button>
        </div>
    </div>

    <!-- ==========================================
         3. リザルト・結果画面 (Result Screen)
         ========================================== -->
    <div id="result-screen" style="display: none;">
        <div class="result-title">Training Complete</div>
        
        <!-- スコア表示 -->
        <div class="result-score" id="result-score">0 / 10</div>
        <!-- 評価メッセージ -->
        <div class="result-comment" id="result-comment"></div>

        <!-- 復習用ミスクリップボード -->
        <div id="review-section" style="display: none;">
            <div class="area-title" style="margin-top: 24px; color: #18181b;">Review Incorrect Answers:</div>
            <div id="incorrect-list"></div>
        </div>

        <button class="check" style="width: 100%; margin-top: 32px;" onclick="backToStart()">Back to Menu</button>
    </div>
</div>

<!-- データの読み込み -->
<script src="data/th/basic_svo_th.js"></script>
<script src="data/ja/basic_sov_ja.js"></script>
<script src="data/ja/question_sov_ja.js"></script>
<script src="data/ja/negative_sov_ja.js"></script>
<script src="data/ja/interrogative_sov_ja.js"></script>
<script src="data/ja/tense_sov_ja.js"></script>
<script src="data/ja/AuxiliaryVerb_can_ja.js"></script>
<script src="data/ja/AuxiliaryVerb_Must_ja.js"></script>
<script src="data/ja/AuxiliaryVerb_MustNot_MayNot_ja.js"></script>
<script src="data/ja/May_Might_ja.js"></script>
<script src="data/th/basic_question_th.js"></script>

<!-- メインロジック -->
<script src="js/app.js"></script>
</body>
</html>
